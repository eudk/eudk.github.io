<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support eudk</title>
  <meta name="description" content="Support eudk's open-source projects and experiments.">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/donate.css">
</head>
<body>
  <canvas id="matrix-canvas" aria-hidden="true"></canvas>

  <header>
    <a class="brand" href="/">eudk</a>
    <a class="back-link" href="/"><span aria-hidden="true">←</span> Front page</a>
  </header>

  <main>
    <section class="support-card">
      <p class="eyebrow">Support my work</p>
      <h1>Fuel the next<br>experiment.</h1>
      <p class="intro">
        If my open-source lists, tools, or experiments have been useful, you can support future work with a coffee.
      </p>

      <a class="coffee-button" href="https://buymeacoffee.com/eudk" target="_blank" rel="noopener noreferrer">
        <span class="coffee-icon" aria-hidden="true">☕</span>
        <span>Buy me a coffee</span>
        <span aria-hidden="true">↗</span>
      </a>

      <div class="support-footer">
        <span>No subscription. No gated content.</span>
        <a href="https://github.com/eudk" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
      </div>
    </section>
  </main>

  <script src="../js/donate.js" defer></script>
</body>
</html>
