<body>
  <div class="background" aria-hidden="true"></div>
  <div class="ambient-terminal" aria-hidden="true">
    <pre class="terminal-ghost terminal-ghost--left">$ locale
LANG=da_DK.UTF-8
LANGUAGE=da:en</pre>
    <pre class="terminal-ghost terminal-ghost--right">$ ls
index.html  style.css</pre>
  </div>

  <main class="hero" aria-labelledby="site-title">
    <h1 id="site-title"><span class="first-name" data-alternate-name="Eugene"><span class="first-name-current">Evgeniy</span></span> Gordienko</h1>

    <nav class="links" aria-label="Primary links">
      <a href="https://github.com/eudk" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a class="projects-easter-egg" href="https://github.com/stars/eudk/lists/projects-26" target="_blank" rel="noopener noreferrer" aria-label="Projects">
        <span class="project-slashes" aria-hidden="true">//</span>
        <span class="projects-label" aria-hidden="true">Projects</span>
      </a>
      <a href="https://linkedin.com/in/eudk" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <span class="nav-separator" aria-hidden="true">//</span>
      <button id="open-contact" type="button">Contact</button>
    </nav>
  </main>

  <section class="contact-overlay" id="contact-overlay" role="dialog" aria-modal="true" aria-labelledby="contact-title" aria-hidden="true">
    <div class="contact-panel">
      <button class="close" id="close-contact" type="button" aria-label="Close contact form">&times;</button>

      <form id="contact-form" action="https://formspree.io/f/xqayznjr" method="POST">
        <h2 id="contact-title">Contact</h2>
        <p class="contact-copy">
          Send a note here or reach me on
          <a href="https://linkedin.com/in/eudk" target="_blank" rel="noopener noreferrer">LinkedIn</a>.
        </p>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Write your message..." required></textarea>

        <label class="consent" for="consent">
          <input id="consent" name="consent" type="checkbox" required>
          <span>I consent to my data being handled as described in the <a href="privacy.html" target="_blank" rel="noopener noreferrer">privacy notice</a>.</span>
        </label>

        <button class="send" id="send-button" type="submit" disabled>Send</button>
      </form>
    </div>
  </section>

  <footer>
